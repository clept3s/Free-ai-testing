<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnAI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0f1117;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: min(800px, 92%);
            background: #181b24;
            border: 1px solid #292d38;
            border-radius: 18px;
            padding: 30px;
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #aaa;
        }

        textarea {
            width: 100%;
            height: 180px;
            resize: vertical;
            background: #101218;
            color: white;
            border: 1px solid #303541;
            border-radius: 12px;
            padding: 15px;
            font-size: 16px;
            outline: none;
        }

        textarea:focus {
            border-color: #666;
        }

        button {
            margin-top: 15px;
            margin-right: 8px;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: white;
            color: #111;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status {
            margin-top: 15px;
            color: #aaa;
        }

        #output {
            margin-top: 25px;
            white-space: pre-wrap;
            line-height: 1.6;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>LearnAI</h1>

    <p>
        Tell the AI about yourself, what you want to learn,
        and how you prefer to learn.
    </p>

    <textarea
        id="input"
        placeholder="Example: I'm trying to learn Python. I'm a beginner, I get bored with long explanations, and I have about 30 minutes per day..."
    ></textarea>

    <br>

    <button id="load">
        Load AI
    </button>

    <button id="generate" disabled>
        Generate learning plan
    </button>

    <div id="status">
        AI not loaded.
    </div>

    <div id="output"></div>

</div>

<script type="module">

    import { pipeline }
        from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.0.1";

    const status =
        document.getElementById("status");

    const loadButton =
        document.getElementById("load");

    const generateButton =
        document.getElementById("generate");

    const input =
        document.getElementById("input");

    const output =
        document.getElementById("output");

    let generator = null;


    // ==========================================
    // LOAD QWEN
    // ==========================================

    loadButton.addEventListener("click", async () => {

        try {

            loadButton.disabled = true;

            status.textContent =
                "Loading Qwen3 0.6B... This may take a while the first time.";

            generator = await pipeline(
                "text-generation",
                "onnx-community/Qwen3-0.6B-ONNX",
                {
                    device: "webgpu",
                    dtype: "q4f16"
                }
            );

            status.textContent =
                "Qwen3 0.6B loaded. The AI is running locally in your browser.";

            generateButton.disabled = false;

        } catch (error) {

            console.error(error);

            status.textContent =
                "Failed to load the AI. Check the browser console (F12) for the error.";

            loadButton.disabled = false;

        }

    });


    // ==========================================
    // GENERATE LEARNING PLAN
    // ==========================================

    generateButton.addEventListener("click", async () => {

        if (!generator) {
            return;
        }

        const userText =
            input.value.trim();

        if (!userText) {

            output.textContent =
                "Tell me something about yourself first.";

            return;
        }

        generateButton.disabled = true;

        output.textContent =
            "Thinking...";


        const messages = [

            {
                role: "system",

                content: `
You are LearnAI, an educational recommendation assistant.

Analyze the user's description and recommend an effective
way for that specific person to learn.

Consider:

- What they want to learn
- Their current knowledge
- Their available time
- Their preferences
- Their difficulties
- Their motivation
- Appropriate learning techniques

Possible techniques include:

- Active recall
- Spaced repetition
- Practice exercises
- Project-based learning
- Worked examples
- Flashcards
- Videos
- Reading
- Quizzes
- Short focused sessions
- Gradually increasing difficulty

Give a concise, practical and personalized recommendation.

Do not invent information about the user.
`
            },

            {
                role: "user",

                content: userText
            }

        ];


        try {

            const result =
                await generator(messages, {

                    max_new_tokens: 400,

                    temperature: 0.7,

                    do_sample: true,

                    repetition_penalty: 1.05

                });


            const generated =
                result[0].generated_text;


            let answer = generated;


            if (Array.isArray(generated)) {

                const lastMessage =
                    generated[generated.length - 1];

                if (
                    lastMessage &&
                    typeof lastMessage === "object" &&
                    lastMessage.content
                ) {
                    answer =
                        lastMessage.content;
                }

            }


            output.textContent =
                answer;

        } catch (error) {

            console.error(error);

            output.textContent =
                "Generation failed. Check the browser console (F12) for the error.";

        }


        generateButton.disabled = false;

    });

</script>

</body>
</html>

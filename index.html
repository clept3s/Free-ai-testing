<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LearnAI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: #0f1117;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: min(800px, 92%);

            background: #181b24;

            border: 1px solid #292d38;
            border-radius: 18px;

            padding: 30px;
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #aaa;
        }

        textarea {
            width: 100%;
            height: 180px;

            resize: vertical;

            background: #101218;
            color: white;

            border: 1px solid #303541;
            border-radius: 12px;

            padding: 15px;

            font-size: 16px;

            outline: none;
        }

        textarea:focus {
            border-color: #666;
        }

        button {
            margin-top: 15px;
            padding: 12px 20px;

            border: none;
            border-radius: 10px;

            background: white;
            color: #111;

            font-weight: bold;

            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status {
            margin-top: 15px;
            color: #aaa;
        }

        #output {
            margin-top: 25px;

            white-space: pre-wrap;

            line-height: 1.6;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>LearnAI</h1>

    <p>
        Tell the AI about yourself, what you want to learn,
        and how you prefer to learn.
    </p>

    <textarea
        id="input"
        placeholder="Example: I'm trying to learn Python. I'm a beginner, I get bored with long explanations, and I have about 30 minutes per day..."
    ></textarea>

    <br>

    <button id="generate">
        Generate learning plan
    </button>

    <div id="status">
        Connecting to AI server...
    </div>

    <div id="output"></div>

</div>

<script>

    /*
        IMPORTANT:

        Replace this with the URL of your Python backend.

        Example:

        https://your-ai-server.example.com
    */

    const API_URL = "YOUR_BACKEND_URL";


    const input =
        document.getElementById("input");

    const generateButton =
        document.getElementById("generate");

    const status =
        document.getElementById("status");

    const output =
        document.getElementById("output");


    generateButton.addEventListener("click", async () => {

        const userText =
            input.value.trim();


        if (!userText) {

            output.textContent =
                "Tell me something about yourself first.";

            return;
        }


        generateButton.disabled = true;

        status.textContent =
            "AI is thinking...";

        output.textContent =
            "";


        try {

            const response = await fetch(
                `${API_URL}/generate`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        message: userText
                    })
                }
            );


            if (!response.ok) {

                throw new Error(
                    `Server returned ${response.status}`
                );

            }


            const data =
                await response.json();


            output.textContent =
                data.response;


            status.textContent =
                "Response generated by the server-side AI.";

        }

        catch (error) {

            console.error(error);

            status.textContent =
                "Could not connect to the AI server.";

            output.textContent =
                "Error: " + error.message;

        }


        generateButton.disabled = false;

    });

</script>

</body>
</html>

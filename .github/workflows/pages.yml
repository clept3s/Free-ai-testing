name: Deploy GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # No build step needed – the site is pure static files.
      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          # The backend folder is ignored by GitHub Pages automatically.

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4